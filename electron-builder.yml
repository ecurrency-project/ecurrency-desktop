# Packaging configuration for electron-builder.
# macOS code signing + notarization (Developer ID) and Windows Authenticode
# signing are both wired below, and both are gated on credentials supplied via
# env at build time.
appId: org.ecurrency.wallet.desktop
productName: eCurrency Wallet
copyright: Copyright © 2026 eCurrency

# Update feed for electron-updater. Each release, the artifacts and the generated
# latest-*.yml are uploaded to this HTTPS folder on the site; the installed app
# reads it to discover and verify updates (SHA512 from the yml + code signature).
publish:
  provider: generic
  url: https://ecurrency.org/download

directories:
  output: release
  buildResources: resources

# electron-vite compiles the app into out/ before packaging.
files:
  - out/**/*
  - package.json

mac:
  target:
    - dmg
    - zip
  category: public.app-category.finance
  artifactName: eCurrency-Wallet-${version}-${arch}.${ext}
  # Developer ID code signing + notarization. Credentials come from env at build
  # time (see docs/signing-macos.md):
  #   CSC_LINK / CSC_KEY_PASSWORD   — Developer ID Application .p12 (CI only; on a
  #                                   Mac with the cert in Keychain you can omit it)
  #   APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER  — App Store Connect API key (.p8)
  # Without credentials `pnpm dist:mac` fails by design — use `pnpm dist:mac:test`
  # (electron-builder.test.yml) for unsigned ad-hoc test builds.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  notarize: true

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: eCurrency-Wallet-${version}-setup.${ext}
  signtoolOptions:
    sign: ./build/sign-windows.cjs
    signingHashAlgorithms:
      - sha256
    # electron-updater checks a downloaded update's signature against this name,
    # and a custom sign hook leaves electron-builder no certificate to read it
    # from. Byte-for-byte the certificate subject.
    publisherName: eCurrency Foundation

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

linux:
  target:
    - AppImage
  category: Finance
  artifactName: eCurrency-Wallet-${version}-${arch}.${ext}
