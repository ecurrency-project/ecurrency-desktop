# Packaging configuration for electron-builder.
# macOS code signing + notarization (Developer ID) is wired below but gated on
# credentials supplied via env at build time (see docs/signing-macos.md). Windows
# signing (Azure Trusted Signing / OV cert) is added later.
appId: org.qbitcoin.wallet.desktop
productName: QBitcoin Wallet
copyright: Copyright © 2026 QBitcoin

# Update feed for electron-updater. Each release, the artifacts and the generated
# latest-*.yml are uploaded to this HTTPS folder on the site; the installed app
# reads it to discover and verify updates (SHA512 from the yml + code signature).
publish:
  provider: generic
  url: https://qbitcoin.net/download # TBD until the network launches

directories:
  output: release
  buildResources: resources

# electron-vite compiles the app into out/ before packaging.
files:
  - out/**/*
  - package.json

mac:
  target:
    - dmg
    - zip
  category: public.app-category.finance
  artifactName: ${productName}-${version}-${arch}.${ext}
  # Developer ID code signing + notarization. Credentials come from env at build
  # time (see docs/signing-macos.md):
  #   CSC_LINK / CSC_KEY_PASSWORD   — Developer ID Application .p12 (CI only; on a
  #                                   Mac with the cert in Keychain you can omit it)
  #   APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER  — App Store Connect API key (.p8)
  # Without credentials `pnpm dist:mac` fails by design — use `pnpm dist:mac:test`
  # (electron-builder.test.yml) for unsigned ad-hoc test builds.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  notarize: true

win:
  target:
    - nsis
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

linux:
  target:
    - AppImage
  category: Finance
  artifactName: ${productName}-${version}-${arch}.${ext}
